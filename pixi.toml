[workspace]
name = "aniposelib-pytorch"
version = "0.9.1"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

[pypi-dependencies]
# cu128 wheels: needed for Blackwell (sm_120) GPUs on the dev machine.
torch = { version = ">=2.7", index = "https://download.pytorch.org/whl/cu128" }
numpy = "<2"
# file-less placeholder that aniposelib-pytorch requires (see shim/)
aniposelib = { path = "shim" }
aniposelib-pytorch = { path = ".", editable = true }

[tasks]
test = "pytest -q"
test-unit = "pytest -q -m 'not integration and not slow and not target'"
test-targets = "pytest -q -rxX -m target"
test-all = "pytest -q -m ''"

# Guard env (D10): only opencv-python (no contrib), so the board code cannot silently
# depend on the legacy contrib aruco functions again. `pixi run -e nocontrib test-nocontrib`.
[feature.nocontrib.pypi-dependencies]
opencv-python = ">=4.8,<5"

[feature.nocontrib.activation.env]
ANIPOSELIB_EXPECT_NOCONTRIB = "1"

[feature.nocontrib.tasks]
test-nocontrib = "pytest -q tests/test_boards.py tests/test_deepcharuco.py tests/test_intrinsics.py tests/test_rig_lab_board.py tests/test_fisheye.py"

[environments]
nocontrib = ["nocontrib"]
