[workspace]
name = "aniposelib"
version = "0.7.2"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

[pypi-dependencies]
# Tesla T4 (sm_75) on driver 470 -> CUDA 11.4 max, so cu118 wheels only, and torch >= 2.4
# cu118 ships a triton that needs a CUDA 12 driver. Same pin as ~/lili-tests/vggt-calib.
torch = { version = "==2.3.1", index = "https://download.pytorch.org/whl/cu118" }
numpy = "<2"
aniposelib = { path = ".", editable = true }

[tasks]
test = "pytest tests/ -q -m 'not integration'"
test-all = "pytest tests/ -q"
