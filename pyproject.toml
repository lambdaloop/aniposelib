[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aniposelib-pytorch"
version = "1.1.0"
description = "PyTorch/GPU camera calibration and triangulation library for Anipose (torch fork of aniposelib; imports as `aniposelib`)"
readme = "README.md"
authors = [
    {name = "Lili Karashchuk", email = "lili.karashchuk@gmail.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Recognition"
]
dependencies = [
    # File-less placeholder under the classic name: makes classic aniposelib (numpy, 0.8.x)
    # impossible to install alongside this package, which also provides the `aniposelib` import.
    "aniposelib==0.0.1",
    "torch>=2.1",
    # OpenCV 5 moved the cv2.fisheye.CALIB_* flags to the top-level cv2 namespace,
    # which breaks the fisheye intrinsics path in cameras.py at import time.
    # boards.py uses only the main-module aruco class API (ArucoDetector/CharucoDetector,
    # stable since 4.8), so contrib is not needed. opencv-contrib-python also provides cv2
    # and keeps working if it is installed instead.
    "opencv-python>=4.8,<5",
    "pandas",
    "numpy",
    "scipy",
    "toml",
    "tqdm",
    "einops"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "build", "twine"]
# learned ChArUco detector (aniposelib.detectors.deepcharuco): HF weight downloads + ONNX backend.
# backend='torch' works without these (plain HTTPS download fallback).
deepcharuco = ["huggingface_hub", "onnxruntime", "onnx"]
# VGGT initialisation hypotheses (aniposelib.init.vggt); the module imports without them
vggt = ["vggt", "huggingface_hub"]
# audio decoding for aniposelib.sync.load_audio (an ffmpeg executable also works without it)
sync = ["soundfile", "av"]
all = ["huggingface_hub", "onnxruntime", "onnx", "vggt", "soundfile", "av"]

[project.urls]
Homepage = "https://github.com/lambdaloop/anipose-lib/tree/pytorch"

[tool.setuptools]
packages = ["aniposelib", "aniposelib.detectors", "aniposelib.init", "aniposelib.workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not target'"
